name: pk-tp probe
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: exchange
        run: |
          set -x
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=private-packagist-trusted-publishing:pkresearchlab" | jq -r .value)
          echo "tokenlen=${#TOK}"
          echo "--- repo=$GITHUB_REPOSITORY workflow=$GITHUB_WORKFLOW_REF ---"
          for U in \
            "https://packagist.com/api/oidc/token-exchange/pkresearchlab/pkresearchlab/probe-t1" \
            "https://packagist.com/api/oidc/token-exchange/pkresearchlab/pkresearchlab%2Fprobe-t1" ; do
            echo "== POST $U"
            curl -sS -o /tmp/r -w "status=%{http_code}\n" -X POST -H "Authorization: Bearer $TOK" "$U"
            cat /tmp/r; echo
          done
